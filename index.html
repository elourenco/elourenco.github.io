<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Bump the icon version when replacing the mark to invalidate favicon caches. -->
    <link
      rel="icon"
      href="/favicon.ico?v=architecture-1"
      sizes="16x16 32x32 48x48"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png?v=architecture-1"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png?v=architecture-1"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      sizes="any"
      href="/favicon.svg?v=architecture-1"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png?v=architecture-1"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020503" />
    <link rel="manifest" href="/site.webmanifest?v=architecture-1" />
    <title>::EDUARDO LOURENCO::</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      (function (history) {
        var params = new URLSearchParams(window.location.search);
        var restoredPath = params.get('p');
        if (!restoredPath) return;
        var restoredQuery = params.get('q');
        history.replaceState(
          null,
          '',
          restoredPath +
            (restoredQuery ? '?' + restoredQuery : '') +
            window.location.hash,
        );
      })(window.history);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
